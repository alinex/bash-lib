Debian:
  stage: Linux
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12"]
  before_script:
    - apt-get update -qq
    - apt-get install -y git curl ca-certificates bats gettext
    # fix timezone
    - ln -fs /usr/share/zoneinfo/Europe/Berlin /etc/localtime && dpkg-reconfigure -f noninteractive tzdata
  script:
    - ./test ci
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
  only:
    - master
    - merge_requests

