stages:
  - Test
  - Debian Based

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
sast:
  stage: Test
dependency_scanning:
  stage: Test
secret_detection:
  stage: Test

Debian:
  stage: Debian Based
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12"]
  before_script:
    - apt-get update -qq
    - apt-get install -y git curl ca-certificates bats gettext
  script:
    - ./test ci
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
  only:
    - master
    - merge_requests

