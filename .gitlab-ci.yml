stages:
    - test
    - variant
    - build

# manual test using: sudo docker run -i gentoo/stage3-amd64 bash

generic:
    stage: test
    image: node:latest
    before_script:
        - npm install -g bats
    script:
        - test/info
        # old tests
        - bats test
        - test/colors
        - test/log-simple
        - test/log-full
        - test/log-auto
        - test/log-file
        - test/log-rotate-size
        - test/log-rotate-time
        - test/log-cmd

debian:
    stage: variant
    image: debian
    before_script:
        - apt-get update
        - apt-get install -y curl
    script:
        - test/info
ubuntu:
    stage: variant
    image: tutum/ubuntu
    before_script:
        - apt-get update
        - apt-get install -y curl
    script:
        - test/info
linux-mint:
    stage: variant
    image: vcatechnology/linux-mint
    before_script:
        - apt-get update
        - apt-get install -y curl
    script:
        - test/info

redhat:
    stage: variant
    image: hjd48/redhat
    script:
        - test/info
centos:
    stage: variant
    image: centos
    before_script:
        - yum install -y net-tools
    script:
        - test/info
mandrake:
    stage: variant
    image: tyuatsu/mandrake
    before_script:
        - yum install -y net-tools
    script:
        - test/info

