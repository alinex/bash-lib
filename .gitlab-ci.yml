stages:
  - Debian

test_debian:
  stage: Debian
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12"]
  before_script:
    #- apt-get update -qq
    #- apt-get install -y git curl ca-certificates bats bats-assert bats-support
    - npm install
  script:
    - mkdir -p test-results
    - npm run test-ci
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
  only:
    - master
    - merge_requests
