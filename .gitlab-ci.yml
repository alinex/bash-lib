pages:
    stage: build
    image: python:alpine
    script:
        ## build distribution
        - apk --update --upgrade add bash bash-completion ncurses git perl
        - bin/build
        - tar czvf bash-lib.tgz dist
        # create documentation
        - apk --update --upgrade add gcc musl-dev jpeg-dev zlib-dev libffi-dev cairo-dev pango-dev gdk-pixbuf
        - pip install mkdocs
        - pip install mkdocs-material
        - pip install pymdown-extensions
        - pip install markdown-blockdiag
        - pip install markdown-include
        - pip install mkdocs-pdf-export-plugin
        - ENABLE_PDF_EXPORT=0 mkdocs build
        # move to website
        - mv site public
        - mv *.tgz public/downloads
        - mv dist/*.bash public/downloads
        - mv dist/install public/downloads
    artifacts:
        paths:
            - public
    only:
        - master
