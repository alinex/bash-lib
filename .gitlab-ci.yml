pages:
    stage: build
    image: silentstorm/pandoc-mkdocs
    script:
        ## build distribution
        - apt-get upgrade
        - apt-get install -y bash bash-completion ncurses git perl
        - bin/build
        - tar czvf bash-lib.tgz dist
        # create documentation
        - apt-get install -y  gcc musl-dev jpeg-dev zlib-dev libffi-dev cairo-dev pango-dev gdk-pixbuf
        - pip install --upgrade pip
        - pip install mkdocs-material
        - pip install pymdown-extensions
        - pip install markdown-blockdiag
        - pip install markdown-include
        - pip install mkdocs-mk2pdf-plugin
        - mkdocs build
        # move to website
        - rm -rf public
        - mv site public
        - mv *.tgz public/downloads
        - mv dist/*.bash public/downloads
        - mv dist/install public/downloads
    artifacts:
        paths:
            - public
    only:
        - master
