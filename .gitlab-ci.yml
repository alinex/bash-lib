stages:
    - test
    - build

# manual test using: sudo docker run -i gentoo/stage3-amd64 bash

generic:
    stage: test
    image: node:latest
    before_script:
        - npm install -g bats
    script:
        - bats test
        - test/colors
        - test/log-simple
        - test/log-full
        - test/log-auto
        - test/log-file
        - test/log-rotate-size
        - test/log-rotate-time
        - test/log-cmd

