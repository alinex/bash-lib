stages:
  - Code Analytics
  - Test Core

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
#  - template: Jobs/Container-Scanning.gitlab-ci.yml
sast:
  stage: Code Analytics
semgrep-sast:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      exists:
        - 'core/*'      # add specific directories
        - 'module/*'    # add folders containing extensionless bash files
        - 'extra/*'     # add folders containing extensionless bash files
dependency_scanning:
  stage: Code Analytics
secret_detection:
  stage: Code Analytics
