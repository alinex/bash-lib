Debian:
  stage: Test Core
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12", "13"]
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y git tzdata curl ca-certificates locales gettext
    # fix timezone
    - ln -fs /usr/share/zoneinfo/Europe/Berlin /etc/localtime && dpkg-reconfigure -f noninteractive tzdata
    # set language
    - sed -i 's/# de_DE.UTF-8 UTF-8/de_DE.UTF-8 UTF-8/' /etc/locale.gen
    - locale-gen
    - update-locale LANG=de_DE.UTF-8
    - export LANG=de_DE.UTF-8
    - export LANGUAGE=de_DE.UTF-8
    - export LC_ALL=de_DE.UTF-8
    # install newest bats
    - git clone https://github.com/bats-core/bats-core.git 2>/dev/null
    - cd bats-core || exit
    - ./install.sh /usr/local >/dev/null
    - cd .. || exit
  script:
    - ./test ci
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
  only:
    - master
    - merge_requests

Ubuntu:
  extends: Debian
  image: ubuntu:$UBUNTU_VERSION
  parallel:
    matrix:
      - UBUNTU_VERSION: ["20.04", "22.04", "24.04"]

