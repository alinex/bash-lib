Debian:
  stage: Test Core
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12", "13"]
  needs: []
  before_script:
    - test-setup/docker-debian
    - mkdir -p test-results
  script:
    - ./test ci
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
  only:
    - master
    - merge_requests

Ubuntu:
  extends: Debian
  image: ubuntu:$UBUNTU_VERSION
  parallel:
    matrix:
      - UBUNTU_VERSION: ["20.04", "22.04", "24.04"]

