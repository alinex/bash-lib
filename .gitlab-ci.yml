Debian:
  stage: Test Distributions
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  image: debian:$DEBIAN_VERSION
  parallel:
    matrix:
      - DEBIAN_VERSION: ["11", "12", "13"]
  needs: []
  before_script:
    - tests/setup/docker-debian
    - mkdir -p tests/results
  script:
    - ./test ci
  artifacts:
    when: always
    paths:
      - tests/results/
    reports:
      junit: tests/results/*.xml
  only:
    - master
    - merge_requests

Ubuntu:
  extends: Debian
  image: ubuntu:$UBUNTU_VERSION
  parallel:
    matrix:
      - UBUNTU_VERSION: ["22.04", "24.04"]

