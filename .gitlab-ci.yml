workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - Code Analytics
  - Test Distributions

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
#  - template: Jobs/Container-Scanning.gitlab-ci.yml
sast:
  stage: Code Analytics
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  interruptible: true
dependency_scanning:
  stage: Code Analytics
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  interruptible: true
secret_detection:
  stage: Code Analytics
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  interruptible: true
