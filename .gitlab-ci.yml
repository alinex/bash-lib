stages:
    - test
    - build

generic:
    stage: test
    image: node:latest
    before_script:
        - npm install -g bats
    script:
        - bats test
        - test/colors
        - test/log-simple
        - test/log-full
        - test/log-auto
        - test/log-file
        - test/log-rotate-size
        - test/log-rotate-time
        - test/log-cmd

