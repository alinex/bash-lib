fedora:
    stage: test
    image: fedora
    before_script:
        - yum -y install findutils net-tools
    script:
        - test/info

gentoo:
    stage: test
    image: gentoo/stage3-amd64
    script:
        - test/info

slackware:
    stage: test
    image: vbatts/slackware
    before_script:
        - slackpkg update
        - slackpkg -batch=on -default_answer=y install curl
    script:
        - test/info

