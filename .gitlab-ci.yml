stages:
  - test
  - variant
  - build

# manual test using: sudo docker run -i gentoo/stage3-amd64 bash

generic:
  stage: test
  image: node:latest
  before_script:
    - apt-get update
    - apt-get install -y net-tools
    - npm install -g bats
  script:
    - test/info
    # old tests
    - bats test
    - test/colors
    - test/log-simple
    - test/log-full
    - test/log-auto
    - test/log-file
    - test/log-rotate-size
    - test/log-rotate-time
    - test/log-cmd
  interruptible: true

debian:
  stage: variant
  image: debian
  before_script:
    - apt-get update
    - apt-get install -y curl net-tools
  script:
    - test/info
  interruptible: true
ubuntu:
  stage: variant
  image: tutum/ubuntu
  before_script:
    - apt-get update
    - apt-get install -y curl
  script:
    - test/info
  interruptible: true
linux-mint:
  stage: variant
  image: vcatechnology/linux-mint
  before_script:
    - apt-get update
    - apt-get install -y curl
  script:
    - test/info
  interruptible: true

redhat:
  stage: variant
  image: hjd48/redhat
  script:
    - test/info
  interruptible: true
centos:
  stage: variant
  image: centos
  before_script:
    - yum install -y net-tools
  script:
    - test/info
  interruptible: true
mandrake:
  stage: variant
  image: tyuatsu/mandrake
  before_script:
    - yum install -y net-tools
  script:
    - test/info
  interruptible: true

# bug: declar -A unknown
suse:
    stage: variant
    image: opensuse
    script:
        - test/info
    interruptible: true

fedora:
  stage: variant
  image: fedora
  before_script:
    - yum -y install findutils net-tools
  script:
    - test/info
  interruptible: true

gentoo:
  stage: variant
  image: gentoo/stage3-amd64
  script:
    - test/info
  interruptible: true

# bug: tput: unknown terminal "dumb"
# bug: curl: error while loading shared libraries: libsasl2.so.3
slackware:
    stage: variant
    image: vbatts/slackware
    before_script:
        - slackpkg update
        - slackpkg -batch=on -default_answer=y install curl
    script:
        - test/info
    interruptible: true

archlinux:
  stage: variant
  image: archlinux
  before_script:
    - pacman -Sy --noconfirm net-tools grep gawk
  script:
    - test/info
  interruptible: true

alpine: 
  stage: variant
  image: alpine
  before_script:
    - pacman -Sy --noconfirm net-tools grep gawk
  script:
    - test/info
  interruptible: true

# presencelab/darwin
# macos
# solaris???
# openbsd

pages:
  stage: build
  image: alinex/mkdocs
  script:
    ## build distribution
    - apt-get update
    - apt-get install -y bash bash-completion git perl
    - bin/build
    - tar czvf bash-lib.tgz dist
    # create documentation
    - "/run.sh"
    # move to website
    - rm -rf public
    - mv site public
    - mv *.tgz public/downloads
    - mv dist/*.bash public/downloads
    - mv dist/install public/downloads
  artifacts:
    paths:
      - public
  interruptible: true

